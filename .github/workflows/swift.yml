# Build and test the native macOS Xcode project.

name: Swift

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: |
        xcodebuild \
          -project MacGiver.xcodeproj \
          -scheme MacGiver \
          -configuration Debug \
          -destination 'platform=macOS' \
          -derivedDataPath "$RUNNER_TEMP/MacGiverBuildDerivedData" \
          build \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY=""
    - name: Run tests
      run: |
        xcodebuild \
          -project MacGiver.xcodeproj \
          -scheme MacGiver \
          -configuration Debug \
          -destination 'platform=macOS' \
          -derivedDataPath "$RUNNER_TEMP/MacGiverTestsDerivedData" \
          test \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY=""
