name: Release DMG

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare release notes from changelog
        run: |
          set -euo pipefail
          previous_tag="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          bash scripts/release-notes-from-changelog.sh \
            "$previous_tag" \
            "$GITHUB_REF_NAME" > "$RUNNER_TEMP/MacGiver-release-notes.md"
          {
            echo "RELEASE_NOTES_PATH=$RUNNER_TEMP/MacGiver-release-notes.md"
            echo "PREVIOUS_TAG=$previous_tag"
          } >> "$GITHUB_ENV"

      - name: Build unsigned app
        run: |
          set -euo pipefail
          xcodebuild \
            -project MacGiver.xcodeproj \
            -scheme MacGiver \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/MacGiverReleaseDerivedData" \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Create DMG
        run: |
          set -euo pipefail
          bash scripts/create-dmg.sh \
            "$RUNNER_TEMP/MacGiverReleaseDerivedData/Build/Products/Release/MacGiver.app" \
            "$RUNNER_TEMP/MacGiver-${GITHUB_REF_NAME}.dmg"
          echo "DMG_PATH=$RUNNER_TEMP/MacGiver-${GITHUB_REF_NAME}.dmg" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file "$RELEASE_NOTES_PATH"
            gh release upload "$GITHUB_REF_NAME" "$DMG_PATH" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$DMG_PATH" \
              --title "MacGiver ${GITHUB_REF_NAME#v}" \
              --notes-file "$RELEASE_NOTES_PATH"
          fi
